# Demonstrates that the reconciler will apply a privilege-GRANTING manifest.
# The subject is deliberately a principal that cannot exist and cannot authenticate:
# example.invalid is reserved by RFC 2606 and can never be registered.
# Nothing and nobody gains access from this object.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zz-configsync-canary-escalation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: zz-nobody-can-be-this@example.invalid
